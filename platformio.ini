; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html



[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
check_tool = clangtidy, cppcheck
check_skip_packages = yes
check_flags =
	clangtidy: --checks=-*,cert-*,clang-analyzer-* --fix
	cppcheck: --enable=all --std=c++11 --suppress=*:*/.pio/* --suppress=*:*/lib/* --suppress=missingIncludeSystem --suppress=unmatchedSuppression --suppress=missingInclude --suppress=unusedFunction
; platform_packages = tool-cppcheck@1.260.0
board_build.filesystem = littlefs

[core]
framework = arduino
build_flags = 
	-D CORE_DEBUG_LEVEL=0
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
	; -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<display.cpp>
; NOTE: Avoid `chain+` / `deep+` with Arduino-ESP32 3.x.
; Those modes can drop framework-internal Network headers from the include path
; (see Network.h / NetworkInterface.h failures in WiFi + AsyncTCP builds).
; Non-`+` modes keep the build stable for this project.
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps = 
	ayushsharma82/ElegantOTA
	ArduinoJson
	adafruit/Adafruit MAX31855 library
	SPI
	https://github.com/adafruit/Adafruit_BusIO
	Wire
	; NOTE: Do not list `Network` here. It's a built-in Arduino-ESP32 framework
	; library dependency of WiFi/AsyncTCP, not a PlatformIO registry package.
	; Adding it to lib_deps makes PlatformIO try (and fail) to install a
	; third-party package named "Network", which can break include resolution.
	; https://github.com/denyssene/SimpleKalmanFilter
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
extra_scripts = pre:extra_scripts.py

[env:esp32-s3]
extends = core
board = esp32-s3-devkitc1-n16r8
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder

[env:esp32-s3-mini]
extends = core
board = lolin_s3_mini
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
build_flags =
	${core.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D S3MINI=1

[env:esp32-s3-elegantota]
extends = env:esp32-s3
upload_protocol = custom
custom_upload_url = http://yaeger.local/update
extra_scripts =
	${core.extra_scripts}
	post:scripts/elegantota_upload.py

[env:esp32-s3-mini-elegantota]
extends = env:esp32-s3-mini
upload_protocol = custom
custom_upload_url = http://yaeger.local/update
extra_scripts =
	${core.extra_scripts}
	post:scripts/elegantota_upload.py

[env:esp32-s3-lcd]
extends = env:esp32-s3
build_flags =
	${env:esp32-s3.build_flags}
	-D ENABLE_LCD=1
build_src_filter = +<*>
lib_deps =
	${core.lib_deps}
	https://github.com/iakop/LiquidCrystal_I2C_ESP32

[env:esp32-s3-mini-lcd]
extends = env:esp32-s3-mini
build_flags =
	${env:esp32-s3-mini.build_flags}
	-D ENABLE_LCD=1
build_src_filter = +<*>
lib_deps =
	${core.lib_deps}
	https://github.com/iakop/LiquidCrystal_I2C_ESP32
