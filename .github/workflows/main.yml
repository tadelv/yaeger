name: Build firmware

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board:
          - esp32-s3
          - esp32-s3-mini

    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-python-3.12-pio-${{ hashFiles('platformio.ini', 'miniweb/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-pio-
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build webUI
        run: cd miniweb && npm ci && npm run build

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==6.1.19"

      - name: Prime pioarduino Python environment
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/python -m pip install --upgrade pip
          ~/.platformio/penv/bin/python -m pip install \
            "uv>=0.1.0" \
            "platformio @ https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip" \
            "littlefs-python>=0.16.0" \
            "fatfs-ng>=0.1.14" \
            "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" \
            "zopfli>=0.2.2" \
            "intelhex>=2.3.0" \
            "rich>=14.0.0" \
            "urllib3<2" \
            "cryptography>=45.0.3" \
            "certifi>=2025.8.3" \
            "ecdsa>=0.19.1" \
            "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" \
            "esp-idf-size>=2.0.0" \
            "esp-coredump>=1.14.0"

      - name: Build PlatformIO Project
        run: |
          pio run -e ${{ matrix.board }} 
          pio run -e ${{ matrix.board }} -t buildfs

      - name: Save firmware file
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: |
            .pio/build/${{ matrix.board }}/firmware.bin
            .pio/build/${{ matrix.board }}/littlefs.bin

  publish:
    if: ${{ github.event_name == 'push' && github.repository == 'tadelv/yaeger' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/firmware

      - name: Switch to artifacts branch
        shell: bash
        run: |
          git fetch origin artifacts || true
          if git show-ref --verify --quiet refs/remotes/origin/artifacts; then
            git checkout artifacts
          else
            git checkout --orphan artifacts
            rm -rf *
          fi

      - name: Update published firmware
        shell: bash
        run: |
          rm -rf firmware
          mkdir -p firmware
          shopt -s nullglob
          for board_dir in /tmp/firmware/*; do
            board_name="${board_dir##*/}"
            board_name="${board_name#firmware-}"
            mkdir -p "firmware/${board_name}"
            cp "${board_dir}/"*.bin "firmware/${board_name}/"
          done

      - name: Commit and push
        shell: bash
        run: |
          if git status --porcelain | grep .; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A firmware
            git commit -m "Publish firmware for ${GITHUB_SHA}"
            git push origin HEAD:artifacts
          else
            echo "No updates to publish"
          fi
