name: Build firmware for releases

on:
  release:
    types:
      - published

jobs:
  determine-boards:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Collect PlatformIO environments
        id: collect
        run: |
          python - <<'PY'
          import configparser
          import json
          import os

          config = configparser.ConfigParser()
          config.read('platformio.ini')

          environments = [section.split('env:', 1)[1]
                          for section in config.sections()
                          if section.startswith('env:')]

          if not environments:
              raise SystemExit('No PlatformIO environments found to build')

          matrix = json.dumps({"board": environments})
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"matrix={matrix}\n")
          PY

  build:
    needs: determine-boards
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.determine-boards.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-python-3.12-pio-${{ hashFiles('platformio.ini', 'miniweb/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-pio-

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build webUI
        run: cd miniweb && npm ci && npm run build

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install "platformio==6.1.19"

      - name: Prime pioarduino Python environment
        run: |
          python -m venv ~/.platformio/penv
          ~/.platformio/penv/bin/python -m pip install --upgrade pip
          ~/.platformio/penv/bin/python -m pip install \
            "uv>=0.1.0" \
            "https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip" \
            "littlefs-python>=0.16.0" \
            "fatfs-ng>=0.1.14" \
            "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" \
            "zopfli>=0.2.2" \
            "intelhex>=2.3.0" \
            "rich>=14.0.0" \
            "urllib3<2" \
            "cryptography>=45.0.3" \
            "certifi>=2025.8.3" \
            "ecdsa>=0.19.1" \
            "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" \
            "esp-idf-size>=2.0.0" \
            "esp-coredump>=1.14.0"

      - name: Build PlatformIO Project
        run: |
          pio run -e ${{ matrix.board }}
          pio run -e ${{ matrix.board }} -t buildfs

      - name: Prepare firmware artifacts
        run: |
          mkdir -p release/${{ matrix.board }}
          cp .pio/build/${{ matrix.board }}/firmware.bin release/${{ matrix.board }}/firmware.bin
          cp .pio/build/${{ matrix.board }}/littlefs.bin release/${{ matrix.board }}/littlefs.bin

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.board }}
          path: release/${{ matrix.board }}
          if-no-files-found: error

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware

      - name: Collect firmware files
        run: |
          set -euo pipefail
          mkdir -p upload/bins
          shopt -s nullglob
          for board_dir in firmware/*; do
            board_name="${board_dir##*/}"
            board_name="${board_name#firmware-}"
            for file in "${board_dir}"/*.bin; do
              base_name="${file##*/}"
              cp "${file}" "upload/bins/${board_name}-${base_name}"
            done
          done
          if [ -z "$(ls -A upload/bins)" ]; then
            echo "No firmware files collected" >&2
            exit 1
          fi

      - name: Upload assets to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in upload/bins/*; do
            base_name="${file##*/}"
            gh release upload "${RELEASE_TAG}" "$file" --clobber --name "bins/${base_name}"
          done
